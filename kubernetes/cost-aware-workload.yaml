apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-aware-api
spec:
  replicas: 2
  selector: {matchLabels: {app: cost-aware-api}}
  template:
    metadata:
      labels:
        app: cost-aware-api
        finops.team: checkout
        finops.cost-center: APP-010
        finops.environment: prod
        finops.application: checkout-api
        finops.owner: platform@example.com
    spec:
      containers:
      - name: api
        image: example/cost-aware-api:latest
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
